extra_javascript = ["javascripts/copyright.js", "javascripts/matrix.js"]
exclude_docs = "/overrides/\n"

[project.theme]
# variant = "classic"
custom_dir = "docs/overrides"
font = false
favicon = "assets/favicon.ico?v=terminal-ico-2"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

logo = "assets/logo.png"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to Matrix mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ubergoonz"
name = "ubergoonz on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/gitlab"
link = "https://gitlab.com/ubergoonz"
name = "ubergoonz on GitLab"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/ubergoonz/"
name = "ubergoonz on LinkedIn"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/in/ubergoonz/"
name = "ubergoonz on X (previously known as Twitter)"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.critic = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.markdown_extensions."zensical.extensions.macros"]
render_by_default = false
module_name = ""
on_undefined = "strict"
on_error_fail = true

[project.extra.consent]
title = "🍪 Cookie consent"
description = """
  We use cookies to recognize your repeated visits and preferences, as well
  as to measure the effectiveness of our documentation and whether users
  find what they're searching for. With your consent, you're helping us to
  make our documentation better.
 """

[project.extra.status]
new = "Recently added"
draft = "Draft - use with pinch of salt"
deprecated = "Deprecated - use with a pinch of salt"
hot = "Hot - popular" 
published = "published from draft"

[project.plugins.blog]
blog_toc = true

[project.plugins.tags]
listings = true

[project.theme.icon.tag]
default = "lucide/hash"
html = "fontawesome/brands/html5"
js = "fontawesome/brands/js"
css = "fontawesome/brands/css3"
bohliao = "material/drama-masks"

[project.extra.tags]
HTML5 = "html"
JavaScript = "js"
CSS = "css"
bohliao = "bohliao"